<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Date Planner ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;background:linear-gradient(135deg,#ffe4ee,#f4e7ff);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#35232d}.card{max-width:560px;margin:auto;background:#fff;border-radius:28px;padding:28px;box-shadow:0 18px 55px #7d4b631f}.hero{text-align:center}.heart{font-size:48px}h1{margin:5px 0;font-size:32px}p{color:#735c67;line-height:1.5}form{display:grid;gap:14px;margin-top:22px}label{font-weight:750;font-size:14px;display:block;margin-bottom:6px}input,select,textarea{width:100%;padding:13px;border:1px solid #ead6df;border-radius:13px;font:inherit;background:#fff}textarea{min-height:80px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:999px;padding:14px 22px;background:#d95383;color:white;font-weight:800;font-size:16px;cursor:pointer;margin-top:5px}.note{text-align:center;font-size:12px;color:#987d89;margin-top:14px}@media(max-width:430px){.row{grid-template-columns:1fr}}#done{display:none;text-align:center;background:#fff0f5;border-radius:18px;padding:20px;margin-top:18px}
</style>
</head>
<body>
<main class="card">
<section class="hero"><div class="heart">❤️</div><h1>Let's Plan Our Date</h1><p>Okay, you said yes 😂 Now let's figure out when and what we're doing.</p></section>
<form id="planner" action="https://formsubmit.co/kaumbakaumba27@gmail.com" method="POST">
<input type="hidden" name="_subject" value="❤️ Date Planner — she's ready to plan!">
<input type="hidden" name="_captcha" value="false"><input type="hidden" name="_template" value="table">
<div><label for="name">Your name</label><input id="name" name="Name" required placeholder="Your name"></div>
<div class="row"><div><label for="day">Date</label><input id="day" name="Preferred date" type="date" required></div><div><label for="time">Time</label><input id="time" name="Preferred time" type="time" required></div></div>
<div><label for="place">Where should we go?</label><select id="place" name="Date location" required><option value="">Choose one...</option><option>Dinner 🍽️</option><option>Movies 🎬</option><option>Ice cream 🍦</option><option>Coffee ☕</option><option>Park / walk 🌳</option><option>Surprise me 👀</option><option>Other</option></select></div>
<div><label for="food">Favourite food</label><input id="food" name="Favourite food" required placeholder="So I don't order the wrong thing 😭"></div>
<div><label for="extra">Anything else I should know?</label><textarea id="extra" name="Extra details" placeholder="Anything you want me to plan for..."></textarea></div>
<button type="submit">Lock In Our Date ❤️</button>
</form>
<div id="done"><strong>DATE LOCKED! 🥳❤️</strong><br><span>I'll get your answers and we'll make it happen.</span></div>
<p class="note">Your answers are sent privately to the person who invited you.</p>
</main>
<script>document.getElementById("planner").addEventListener("submit",()=>document.getElementById("done").style.display="block");</script>
</body>
</html>
