<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Date Planner ❤️</title>
<style>
body{margin:0;padding:22px;background:linear-gradient(135deg,#ffe4ee,#f4e7ff);font-family:system-ui;color:#35232d}.card{max-width:560px;margin:auto;background:white;border-radius:28px;padding:28px;box-shadow:0 18px 55px #7d4b631f}.hero{text-align:center}.heart{font-size:48px}h1{margin:5px 0}p{color:#735c67;line-height:1.5}form{display:grid;gap:14px;margin-top:22px}label{font-weight:700;font-size:14px;display:block;margin-bottom:6px}input,select,textarea{width:100%;padding:13px;border:1px solid #ead6df;border-radius:13px;font:inherit;background:white;box-sizing:border-box}textarea{min-height:80px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.options label{border:1px solid #ead6df;border-radius:14px;padding:12px;text-align:center}.options input{width:auto}button{border:0;border-radius:999px;padding:14px;background:#d95383;color:white;font-weight:800;font-size:16px}.note{text-align:center;font-size:12px;color:#987d89}@media(max-width:430px){.row,.options{grid-template-columns:1fr}}
</style></head><body><main class="card"><section class="hero"><div class="heart">❤️</div><h1>Let's Plan Our Date</h1><p>Okay, you said yes 😂 Now let's figure out when and what we're doing.</p></section>
<form action="https://formsubmit.co/kaumbakaumba27@gmail.com" method="POST">
<input type="hidden" name="_subject" value="❤️ Date Planner — she's ready to plan!"><input type="hidden" name="_captcha" value="false"><input type="hidden" name="_template" value="table">
<div><label>Your name</label><input name="Name" required placeholder="Your name"></div>
<div class="row"><div><label>Date</label><input name="Preferred date" type="date" required></div><div><label>Time</label><input name="Preferred time" type="time" required></div></div>
<div><label>Where should we go?</label><select name="Date location" required><option value="">Choose one...</option><option>Dinner 🍽️</option><option>Movies 🎬</option><option>Ice cream 🍦</option><option>Coffee ☕</option><option>Park / walk 🌳</option><option>Surprise me 👀</option><option>Other</option></select></div>
<div><label>Favourite food</label><input name="Favourite food" required placeholder="So I don't order the wrong thing 😭"></div>
<div><label>And the important question 😂</label><div class="options">
<label><input type="radio" name="Affection preference" value="Hold hands 🤝❤️" required> Hold hands 🤝❤️</label>
<label><input type="radio" name="Affection preference" value="Kiss 😘"> Kiss 😘</label>
<label><input type="radio" name="Affection preference" value="Both 🤝😘"> Both 🤝😘</label>
<label><input type="radio" name="Affection preference" value="Let's see how it goes 😊"> Let's see how it goes 😊</label>
</div></div>
<div><label>Anything else I should know?</label><textarea name="Extra details" placeholder="Anything you want me to plan for..."></textarea></div>
<button type="submit">Lock In Our Date ❤️</button></form><p class="note">Choose only what you're comfortable with. No pressure ❤️</p></main></body></html>
